name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets actions/deploy-pages publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs `npm ci` then `npm run build` (astro check + astro build) and
      # uploads dist/ as the Pages artifact. `site` and `base` come from
      # astro.config.mjs, so nothing is configured twice.
      - name: Install, build and upload
        uses: withastro/action@v3
        with:
          node-version: 22
        # Repository *variables*, not secrets, and deliberately so: all three
        # are compiled into the client bundle by Astro and are readable by
        # anyone who opens devtools on the deployed site. Calling them secrets
        # would imply a protection that does not exist. See .env.example.
        #
        # They are not optional. Without them the build still succeeds and
        # silently ships `undefined` into the RSVP form's function URL and the
        # Turnstile site key — a reply form that looks perfect and cannot send.
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's own default is 600000, and that is no longer enough.
          # This deploy is a 16MB artifact of 199 mostly-image files, and the
          # Pages service has been slow with it: 2m29s, then 8m41s, 9m00s and
          # 10m11s on consecutive runs, and then a run that crossed the default
          # and aborted with "Timeout reached" while the build itself had
          # finished in 1m51s. Nothing about the site changed to cause that —
          # the wait is on GitHub's side of the handover.
          #
          # 30 minutes, so a slow afternoon does not read as a broken deploy.
          # It is a ceiling, not a delay: a fast publish still returns in
          # seconds.
          timeout: 1800000
